<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=0.5, user-scalable=yes">
  <title>电子刊</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #1a1a1a; overflow: hidden; }
    /* ====== 品牌主色（默认 #4f46e5；JS 启动后用 tenant.primary_color 覆盖）====== */
    :root {
      --primary: #4f46e5;
    }
    .splash {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #1a1a1a;
      z-index: 1000;
      cursor: pointer;
      overflow: hidden;
    }
    /* 封面作为主视觉 */
    .splash-cover {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      opacity: 0;
      transition: opacity 0.8s ease-out;
    }
    .splash-cover.show { opacity: 1; }
    /* 底部信息条：logo + 标题 */
    .splash-info {
      position: absolute;
      left: 50%; bottom: 60px;
      transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center;
      z-index: 2;
    }
    .splash-logo {
      width: 56px; height: 56px;
      object-fit: contain;
      opacity: 0;
      transform: scale(0.85);
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    }
    .splash-logo.show { opacity: 1; transform: scale(1); }
    .splash-logo-fallback {
      width: 56px; height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      opacity: 0;
      transform: scale(0.85);
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
    }
    .splash-logo-fallback.show { opacity: 1; transform: scale(1); }
    /* ====== 标题：应用租户主色 ====== */
    .splash-title {
      margin-top: 12px;
      color: #fff;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 6px;
      opacity: 0;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
      transition: opacity 0.5s 0.4s, color 0.3s;
    }
    .splash-title.show { opacity: 1; }
    .splash-title.branded {
      /* 应用主色 + 描边增强：封面背景多变，保证可读性 */
      color: var(--primary);
      -webkit-text-stroke: 1px rgba(255,255,255,0.6);
      text-shadow: 0 0 8px rgba(0,0,0,0.6), 0 2px 12px rgba(0,0,0,0.5);
    }
    .splash-line {
      margin-top: 8px;
      width: 30px; height: 2px;
      background: rgba(255,255,255,0.6);
      opacity: 0;
      transition: opacity 0.5s 0.6s, background 0.3s, width 0.4s;
    }
    .splash-line.show { opacity: 1; }
    .splash-line.branded { background: var(--primary); width: 50px; }
    /* ====== Skip 按钮：应用主色 ====== */
    .splash-skip {
      position: fixed; bottom: 24px;
      left: 50%; transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      font-family: 'PingFang SC', sans-serif;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.5s 1s, background 0.3s, color 0.3s, padding 0.3s;
      cursor: pointer;
      z-index: 3;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      user-select: none;
    }
    .splash-skip.show { opacity: 1; }
    .splash-skip:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      text-shadow: none;
      padding: 8px 28px;
    }
    /* 移动端：底部条上移 */
    @media (max-width: 768px) {
      .splash-info { bottom: 72px; }
      .splash-logo, .splash-logo-fallback { width: 44px; height: 44px; }
      .splash-title { font-size: 15px; letter-spacing: 4px; }
    }

    /* ====== 鉴权提示页（覆盖整个 splash）====== */
    .auth-page {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #1a1a1a;
      z-index: 2000;
      padding: 24px;
    }
    .auth-card {
      max-width: 360px; width: 100%;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 36px 28px;
      text-align: center;
      color: #fff;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    }
    .auth-icon { font-size: 48px; margin-bottom: 18px; }
    .auth-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: var(--primary);
    }
    .auth-hint {
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
<div class="splash" id="splash">
  <img class="splash-cover" id="cover" alt="">
  <div class="splash-info">
    <img class="splash-logo" id="logo" src="images/logo.png" alt="logo" onerror="this.style.display='none';var f=document.getElementById('logoFallback');if(f)f.style.display='flex';">
    <div class="splash-logo-fallback" id="logoFallback" style="display:none">📚</div>
    <div class="splash-title" id="title">电子刊</div>
    <div class="splash-line" id="line"></div>
  </div>
</div>
<div class="splash-skip" id="skip">点击进入 →</div>

<div class="auth-page" id="authPage" style="display:none"></div>

<script src="config.js"></script>
<script src="reader/secret.js?v=1"></script>
<script src="reader/track.js"></script>
<script>
(function() {
  // ====== 多租户：解析当前 tenant slug ======
  // 优先级：URL ?t=xxx > window.MAG_CONFIG.DEFAULT_TENANT
  function resolveTenant() {
    var q = new URLSearchParams(location.search).get('t');
    return (q && q.trim()) || (window.MAG_CONFIG && window.MAG_CONFIG.DEFAULT_TENANT) || 'zhuobao';
  }
  var tenantSlug = resolveTenant();

  // ====== Secret 鉴权：URL ?s=xxx 优先 → localStorage 兜底 ======
  var initSecret = window.MAG_READER_AUTH.init();
  var hasSecret = !!initSecret;

  // HTML 转义（防御 XSS：用于错误页 URL 参数回显）
  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // ====== 鉴权失败 / 缺 secret：展示提示页（覆盖整个 splash）======
  function showAuthPage(kind) {
    // kind: 'missing'（URL 没 ?s= 且 localStorage 空）| 'invalid'（401）
    var $splash = document.getElementById('splash');
    var $skip = document.getElementById('skip');
    if ($splash) $splash.style.display = 'none';
    if ($skip) $skip.style.display = 'none';
    var $page = document.getElementById('authPage');
    if (!$page) return;
    var title, hint, icon;
    if (kind === 'invalid') {
      icon = '🔒';
      title = '链接无效';
      hint = '该阅读链接已失效或被撤销，请联系客户获取新的链接。';
    } else {
      icon = '🔑';
      title = '请通过客户提供的链接访问';
      hint = '本页面需要有效的阅读链接才能打开。请使用客户分享给你的完整链接。';
    }
    $page.innerHTML =
      '<div class="auth-card">' +
        '<div class="auth-icon">' + icon + '</div>' +
        '<div class="auth-title">' + escapeHtml(title) + '</div>' +
        '<div class="auth-hint">' + escapeHtml(hint) + '</div>' +
      '</div>';
    $page.style.display = 'flex';
  }

  // 没 secret → 立即展示「请通过链接访问」页，不再拉数据
  if (!hasSecret) {
    showAuthPage('missing');
    return;
  }

  // 401 监听：后端拒绝 → 展示「链接无效」页
  window.addEventListener('reader:auth_failed', function() {
    clearTimeout(timer);
    showAuthPage('invalid');
  });

  // 把 tenant + secret 传下去：点 skip / 自动跳转时都带上
  // secret 跨页传播：URL ?s= 兜底（即使 localStorage 清了，后续页面也能用）
  function goDirectory() {
    clearTimeout(timer);
    var sec = window.MAG_READER_AUTH.getSecret() || '';
    var sep = sec ? '&s=' + encodeURIComponent(sec) : '';
    location.href = 'directory.html?t=' + encodeURIComponent(tenantSlug) + sep;
  }
  var timer = setTimeout(goDirectory, 3000);

  document.getElementById('splash').addEventListener('click', goDirectory);
  document.getElementById('skip').addEventListener('click', function(e) {
    e.stopPropagation();
    goDirectory();
  });

  // 探测设备类型：UA 优先，screen width 兜底
  function detectDeviceType() {
    var ua = navigator.userAgent || '';
    if (/Mobile|Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua)) {
      return 'mobile';
    }
    if (window.innerWidth <= 768) return 'mobile';
    return 'pc';
  }

  // ====== 拉 data（live 后端） + 本地按 tenant 过滤 ======
  // SaaS 默认：fetch 同源 /api/public/data
  // 也可走 MAG_CONFIG.DATA_URL（OSS / 跨域后端 / 任何 URL）
  function loadData() {
    var url = (window.MAG_CONFIG && window.MAG_CONFIG.DATA_URL) || (location.origin + '/api/public/data');
    return window.MAG_READER_AUTH.fetch(url, { cache: 'no-cache' }).then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' 拉 data 失败');
      return r.json();
    });
  }

  function findTenant(data, slug) {
    var list = (data.tenants || []);
    for (var i = 0; i < list.length; i++) {
      if (list[i].slug === slug) return list[i];
    }
    return null;
  }

  // ====== 应用租户品牌（主色 + logo）======
  function applyBranding(tenant) {
    if (!tenant) return;
    // 1) 主色：写入 CSS 变量
    var color = tenant.primary_color || (window.MAG_CONFIG && window.MAG_CONFIG.PRIMARY_COLOR) || '#4f46e5';
    document.documentElement.style.setProperty('--primary', color);
    // 2) 标题：应用主色
    var title = document.getElementById('title');
    if (title) title.classList.add('branded');
    // 3) 装饰线：加粗 + 主色
    var line = document.getElementById('line');
    if (line) line.classList.add('branded');
    // 4) Logo：替换 src（fallback 已通过 onerror 处理）
    if (tenant.logo_url) {
      var logo = document.getElementById('logo');
      if (logo) {
        logo.src = tenant.logo_url;
        logo.style.display = '';
        var fb = document.getElementById('logoFallback');
        if (fb) fb.style.display = 'none';
      }
    }
  }

  // 拉封面：按当前 tenant + 设备类型 取全局（magazine_id=null）的最新一张
  function loadCover() {
    var type = detectDeviceType();
    return loadData().then(function(data) {
      var tenant = findTenant(data, tenantSlug);
      if (!tenant) throw new Error('tenant "' + tenantSlug + '" 不存在');

      // 应用品牌（主色 + logo）
      applyBranding(tenant);

      // 标题用租户名
      var $title = document.getElementById('title');
      $title.textContent = (tenant.name || '') + '电子刊';
      document.title = tenant.name ? (tenant.name + '电子刊') : '电子刊';

      var covers = (data.covers || []).filter(function(c) {
        return c.tenant_id === tenant.id
            && c.type === type
            && c.magazine_id == null;
      });
      // data.covers 已按 created_at desc 排序（snapshotForPublish 保留 db 排序），第一条即最新
      if (covers.length === 0) throw new Error('tenant "' + tenantSlug + '" ' + type + ' 暂无封面');
      return covers[0];
    }).then(function(cover) {
      var $cover = document.getElementById('cover');
      $cover.src = cover.image_path;
      if ($cover.complete && $cover.naturalWidth > 0) {
        $cover.classList.add('show');
      } else {
        $cover.onload = function() { $cover.classList.add('show'); };
      }
    });
  }

  // 拉失败 → 降级到 logo 主视觉（仍然跳目录）
  function fallbackToLogo() {
    console.warn('[splash] 拉封面失败，降级到 logo');
    var $logo = document.getElementById('logo');
    if ($logo && $logo.complete && $logo.naturalWidth > 0) {
      $logo.style.width = '180px';
      $logo.style.height = '180px';
      $logo.style.filter = 'invert(1) drop-shadow(0 2px 8px rgba(0,0,0,0.3))';
    } else {
      // 启用 fallback emoji
      var fb = document.getElementById('logoFallback');
      if (fb) {
        fb.style.display = 'flex';
        fb.style.width = '180px';
        fb.style.height = '180px';
        fb.style.fontSize = '120px';
        fb.style.opacity = '0.6';
      }
    }
    document.querySelector('.splash').style.background = '#2a2a2a';
  }

  // 启动：拉封面 + 动画
  window.addEventListener('load', function() {
    loadCover().then(function() {
      // 埋点：splash 展示（tenant-level view，不带 magazine_id）
      try { window.MAG_TRACK.trackEvent({ tenant_slug: tenantSlug, event_type: 'view' }); } catch (e) {}
    }).catch(fallbackToLogo);
    setTimeout(function() { document.getElementById('logo').classList.add('show'); document.getElementById('logoFallback').classList.add('show'); }, 100);
    setTimeout(function() { document.getElementById('title').classList.add('show'); }, 400);
    setTimeout(function() { document.getElementById('line').classList.add('show'); }, 600);
    setTimeout(function() { document.getElementById('skip').classList.add('show'); }, 800);
  });
})();
</script>
</body>
</html>
