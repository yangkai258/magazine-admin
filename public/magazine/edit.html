<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>杂志详情</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">📚 杂志管理平台</div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-item"><span class="nav-icon">📊</span> 总览</a>
        <a href="/magazine/list.html" class="nav-item active"><span class="nav-icon">📖</span> 杂志管理</a>
        <a href="/cover/list.html" class="nav-item"><span class="nav-icon">🖼</span> 封面管理</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="top-bar">
        <h1 class="page-title" id="pageTitle">杂志详情</h1>
        <a href="/magazine/list.html" class="btn btn-secondary btn-sm" style="margin-left:auto">← 返回列表</a>
      </header>
      <div class="content-area">
        <!-- 基本信息 -->
        <div class="card" style="margin-bottom:20px">
          <div class="card-title">基本信息</div>
          <input type="hidden" id="mId">
          <div class="form-row">
            <div class="form-group">
              <label>杂志名称 *</label>
              <input type="text" id="mName" placeholder="如：2026春季刊">
            </div>
            <div class="form-group">
              <label>上传日期 *</label>
              <input type="date" id="mDate">
            </div>
          </div>
          <div class="form-group" style="margin-bottom:16px">
            <label>内容介绍</label>
            <textarea id="mDesc" placeholder="杂志内容简介..."></textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>PC端封面</label>
              <div style="display:flex;gap:8px;align-items:center">
                <img id="mCoverPcPreview" style="width:80px;height:50px;object-fit:cover;border-radius:4px;background:#eee">
                <input type="text" id="mCoverPc" placeholder="封面图片URL" style="flex:1">
              </div>
            </div>
            <div class="form-group">
              <label>移动端封面</label>
              <div style="display:flex;gap:8px;align-items:center">
                <img id="mCoverMobilePreview" style="width:80px;height:50px;object-fit:cover;border-radius:4px;background:#eee">
                <input type="text" id="mCoverMobile" placeholder="封面图片URL" style="flex:1">
              </div>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:16px">
            <label>状态</label>
            <select id="mEnabled" style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px">
              <option value="1">启用</option>
              <option value="0">停用</option>
            </select>
          </div>
          <button class="btn btn-primary" id="saveBtn">保存基本信息</button>
        </div>

        <!-- 杂志页管理 -->
        <div class="card">
          <div class="card-title">
            杂志页管理
            <div style="display:flex;gap:8px">
              <label class="btn btn-secondary btn-sm" style="cursor:pointer">
                ＋ 单页上传
                <input type="file" id="singleUpload" accept="image/*" style="display:none">
              </label>
              <label class="btn btn-secondary btn-sm" style="cursor:pointer">
                ＋ 批量上传
                <input type="file" id="batchUpload" accept="image/*" multiple style="display:none">
              </label>
            </div>
          </div>

          <!-- 拖拽上传区 -->
          <div class="upload-zone" id="dropZone" style="margin-bottom:20px">
            <div style="font-size:28px;margin-bottom:8px">📤</div>
            <p>将图片拖拽到这里，或点击上方的「单页上传」「批量上传」</p>
            <p style="font-size:12px;margin-top:4px">支持 JPG/PNG/GIF，单文件最大 50MB</p>
          </div>

          <p id="pageCountLabel" style="font-size:13px;color:var(--text-secondary);margin-bottom:12px"></p>
          <div class="page-list" id="pageList"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script>
    const magazineId = new URLSearchParams(location.search).get('id');
    let pages = [];
    let draggedEl = null;

    async function load() {
      const m = await api.get('/magazines/' + magazineId);
      document.getElementById('pageTitle').textContent = m.name;
      document.getElementById('mId').value = m.id;
      document.getElementById('mName').value = m.name;
      document.getElementById('mDate').value = m.upload_date ? m.upload_date.slice(0,10) : '';
      document.getElementById('mDesc').value = m.description || '';
      document.getElementById('mCoverPc').value = m.cover_pc || '';
      document.getElementById('mCoverMobile').value = m.cover_mobile || '';
      document.getElementById('mEnabled').value = m.enabled;
      document.getElementById('mCoverPcPreview').src = coverImg(m.cover_pc);
      document.getElementById('mCoverMobilePreview').src = coverImg(m.cover_mobile);
      pages = m.pages || [];
      renderPages();
    }

    function renderPages() {
      document.getElementById('pageCountLabel').textContent = `共 ${pages.length} 页，拖拽可排序`;
      document.getElementById('pageList').innerHTML = pages.map((p, i) => `
        <div class="page-thumb" draggable="true" data-id="${p.id}" data-index="${i}">
          <img src="${coverImg(p.image_path)}" onerror="this.parentElement.style.background='#eee'">
          <div class="page-num">第 ${i + 1} 页</div>
          <button class="page-del" onclick="deletePage(${p.id}, event)">×</button>
        </div>
      `).join('');

      // 拖拽事件
      document.querySelectorAll('.page-thumb').forEach(el => {
        el.addEventListener('dragstart', e => { draggedEl = el; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
        el.addEventListener('dragend', e => { el.classList.remove('dragging'); draggedEl = null; });
        el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dragover'); });
        el.addEventListener('dragleave', e => { el.classList.remove('dragover'); });
        el.addEventListener('drop', e => {
          e.preventDefault();
          el.classList.remove('dragover');
          if (!draggedEl || draggedEl === el) return;
          const fromIdx = Number(draggedEl.dataset.index);
          const toIdx = Number(el.dataset.index);
          const [moved] = pages.splice(fromIdx, 1);
          pages.splice(toIdx, 0, moved);
          renderPages();
          saveOrder();
        });
      });
    }

    async function saveOrder() {
      await api.put('/magazines/' + magazineId + '/pages/reorder', { orderedIds: pages.map(p => p.id) });
      toast('排序已保存', 'success');
    }

    async function deletePage(id, e) {
      e.stopPropagation();
      if (!confirm('确认删除该页面？')) return;
      await api.del('/magazines/' + magazineId + '/pages/' + id);
      toast('已删除', 'success');
      pages = pages.filter(p => p.id !== id);
      renderPages();
    }

    document.getElementById('saveBtn').addEventListener('click', async () => {
      await api.put('/magazines/' + magazineId, {
        name: document.getElementById('mName').value,
        upload_date: document.getElementById('mDate').value,
        description: document.getElementById('mDesc').value,
        cover_pc: document.getElementById('mCoverPc').value,
        cover_mobile: document.getElementById('mCoverMobile').value,
        enabled: Number(document.getElementById('mEnabled').value)
      });
      toast('保存成功', 'success');
      document.getElementById('pageTitle').textContent = document.getElementById('mName').value;
    });

    // 封面上传-输入URL时预览
    document.getElementById('mCoverPc').addEventListener('input', e => { document.getElementById('mCoverPcPreview').src = coverImg(e.target.value) || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="50" fill="%23ddd"><rect width="80" height="50"/></svg>'; });
    document.getElementById('mCoverMobile').addEventListener('input', e => { document.getElementById('mCoverMobilePreview').src = coverImg(e.target.value) || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="80" height="50" fill="%23ddd"><rect width="80" height="50"/></svg>'; });

    // 单页上传
    document.getElementById('singleUpload').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('image', file);
      try {
        const newPage = await api.post('/magazines/' + magazineId + '/pages', fd, true);
        pages.push(newPage);
        renderPages();
        toast('上传成功', 'success');
      } catch (err) { toast(err.message, 'error'); }
      e.target.value = '';
    });

    // 批量上传
    document.getElementById('batchUpload').addEventListener('change', async e => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      const fd = new FormData();
      files.forEach(f => fd.append('images', f));
      try {
        const newPages = await api.post('/magazines/' + magazineId + '/pages/batch', fd, true);
        pages.push(...newPages);
        renderPages();
        toast(`成功上传 ${newPages.length} 页`, 'success');
      } catch (err) { toast(err.message, 'error'); }
      e.target.value = '';
    });

    // 拖拽上传
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', e => { dropZone.classList.remove('dragover'); });
    dropZone.addEventListener('drop', async e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      if (!files.length) return;
      const fd = new FormData();
      files.forEach(f => fd.append('images', f));
      try {
        const newPages = await api.post('/magazines/' + magazineId + '/pages/batch', fd, true);
        pages.push(...newPages);
        renderPages();
        toast(`成功上传 ${newPages.length} 页`, 'success');
      } catch (err) { toast(err.message, 'error'); }
    });

    load();
  </script>
</body>
</html>
