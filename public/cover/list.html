<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>封面管理</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">📚 杂志管理平台</div>
      <nav class="sidebar-nav">
        <a href="/" class="nav-item"><span class="nav-icon">📊</span> 总览</a>
        <a href="/magazine/list.html" class="nav-item"><span class="nav-icon">📖</span> 杂志管理</a>
        <a href="/cover/list.html" class="nav-item active"><span class="nav-icon">🖼</span> 封面管理</a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="top-bar"><h1 class="page-title">封面管理</h1></header>
      <div class="content-area">
        <div class="tabs">
          <button class="tab active" data-type="pc">🖥 PC端封面</button>
          <button class="tab" data-type="mobile">📱 移动端封面</button>
        </div>
        <div style="margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap">
          <select id="magazineSelect" style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;min-width:180px">
            <option value="">全部杂志</option>
          </select>
          <button class="btn btn-primary btn-sm" id="uploadBtn">＋ 上传封面</button>
          <input type="file" id="coverFileInput" accept="image/*" style="display:none">
        </div>
        <div class="cover-grid" id="coverGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none">
          <div class="empty-icon">🖼</div>
          <p>还没有封面，点「上传封面」开始</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let currentType = 'pc';
    let magazines = [];
    let allCovers = [];

    async function load() {
      [magazines, allCovers] = await Promise.all([
        api.get('/magazines'),
        api.get('/covers')
      ]);
      const select = document.getElementById('magazineSelect');
      select.innerHTML = '<option value="">全部杂志</option>' +
        magazines.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
      render();
    }

    function render() {
      const filterMagazine = document.getElementById('magazineSelect').value;
      const covers = allCovers.filter(c => {
        if (c.type !== currentType) return false;
        if (filterMagazine && c.magazine_id != filterMagazine) return false;
        return true;
      });

      const grid = document.getElementById('coverGrid');
      const empty = document.getElementById('emptyState');
      if (covers.length === 0) {
        grid.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      grid.innerHTML = covers.map(c => {
        const magazine = magazines.find(m => m.id == c.magazine_id);
        return `
          <div class="cover-card" data-id="${c.id}">
            <img src="${coverImg(c.image_path)}" class="cover-card-img" onerror="this.style.display='none'">
            <div class="cover-card-body">
              <div style="font-size:13px;font-weight:500">${magazine ? magazine.name : '通用封面'}</div>
              <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">${c.type === 'pc' ? '🖥 PC端' : '📱 移动端'}</div>
              <div class="cover-card-meta">
                <span class="cover-type-badge ${c.type === 'mobile' ? 'mobile' : ''}">${c.type === 'pc' ? 'PC' : 'Mobile'}</span>
                <button class="btn btn-xs btn-danger" onclick="deleteCover(${c.id})">删除</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function deleteCover(id) {
      if (!confirm('确认删除该封面？')) return;
      await api.del('/covers/' + id);
      toast('删除成功', 'success');
      allCovers = allCovers.filter(c => c.id !== id);
      render();
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentType = tab.dataset.type;
        render();
      });
    });

    document.getElementById('magazineSelect').addEventListener('change', render);

    document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('coverFileInput').click());

    document.getElementById('coverFileInput').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;
      const magazine_id = document.getElementById('magazineSelect').value;
      const fd = new FormData();
      fd.append('image', file);
      fd.append('type', currentType);
      if (magazine_id) fd.append('magazine_id', magazine_id);
      try {
        const cover = await api.post('/covers/upload', fd, true);
        allCovers.unshift(cover);
        render();
        toast('上传成功', 'success');
      } catch (err) { toast(err.message, 'error'); }
      e.target.value = '';
    });

    load();
  </script>
</body>
</html>
