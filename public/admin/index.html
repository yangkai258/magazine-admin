<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>杂志管理平台</title>
  <link rel="stylesheet" href="/admin/css/style.css">
  <script src="/admin/js/auth.js"></script>
</head>
<body>
  <script>MAG_AUTH.requireAuth();</script>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">📚 杂志管理平台</div>
      <nav class="sidebar-nav">
        <a href="/admin/" class="nav-item active" data-page="dashboard">
          <span class="nav-icon">📊</span> 总览
        </a>
        <a href="/admin/magazine/list.html" class="nav-item" data-page="magazine">
          <span class="nav-icon">📖</span> 杂志管理
        </a>
        <a href="/admin/cover/list.html" class="nav-item" data-page="cover">
          <span class="nav-icon">🖼</span> 封面管理
        </a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="top-bar">
        <h1 class="page-title">总览</h1>
        <button class="btn btn-secondary btn-sm" style="margin-left:auto" onclick="MAG_AUTH.logout()">退出登录</button>
      </header>
      <div class="content-area" id="contentArea">
        <div class="dashboard-cards">
          <div class="dash-card">
            <div class="dash-card-icon">📖</div>
            <div class="dash-card-info">
              <div class="dash-card-num" id="totalMagazines">--</div>
              <div class="dash-card-label">杂志总数</div>
            </div>
          </div>
          <div class="dash-card">
            <div class="dash-card-icon">✅</div>
            <div class="dash-card-info">
              <div class="dash-card-num" id="totalEnabled">--</div>
              <div class="dash-card-label">启用数</div>
            </div>
          </div>
          <div class="dash-card">
            <div class="dash-card-icon">🖼</div>
            <div class="dash-card-info">
              <div class="dash-card-num" id="totalCovers">--</div>
              <div class="dash-card-label">封面数量</div>
            </div>
          </div>
          <div class="dash-card">
            <div class="dash-card-icon">📄</div>
            <div class="dash-card-info">
              <div class="dash-card-num" id="totalPages">--</div>
              <div class="dash-card-label">杂志页总数</div>
            </div>
          </div>
        </div>

        <div class="publish-panel" style="margin-top:24px;padding:20px 24px;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;gap:16px;">
          <div style="flex:1">
            <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px">📤 发布到阅读端</div>
            <div style="font-size:13px;color:var(--text-secondary)">把当前所有数据（杂志 / 页 / 封面）打包成 data.json 推到 OSS。阅读端会在 5 分钟内（CDN 缓存）看到最新数据。</div>
            <div id="publishInfo" style="margin-top:8px;font-size:12px;color:var(--text-secondary)">未发布过</div>
          </div>
          <button id="publishBtn" class="btn btn-primary" onclick="publishToReader()">立即发布</button>
        </div>
      </div>
    </main>
  </div>
  <script src="/admin/js/api.js"></script>
  <script>
    (async function() {
      try {
        const [magazines, covers] = await Promise.all([
          api.get('/magazines'),
          api.get('/covers')
        ]);
        document.getElementById('totalMagazines').textContent = magazines.length;
        document.getElementById('totalEnabled').textContent = magazines.filter(m => m.enabled).length;
        document.getElementById('totalCovers').textContent = covers.length;
        let pageCount = 0;
        for (const m of magazines) {
          const detail = await api.get('/magazines/' + m.id);
          pageCount += (detail.pages || []).length;
        }
        document.getElementById('totalPages').textContent = pageCount;
      } catch(e) {
        document.getElementById('contentArea').innerHTML = '<div style="padding:40px;color:#e53935">加载失败：' + e.message + '</div>';
      }
    })();

    async function publishToReader() {
      const btn = document.getElementById('publishBtn');
      const info = document.getElementById('publishInfo');
      if (btn.disabled) return;
      btn.disabled = true;
      const oldText = btn.textContent;
      btn.textContent = '发布中…';
      info.textContent = '正在推 data.json 到 OSS…';
      try {
        const r = await api.post('/admin/publish');
        if (r && r.success) {
          info.innerHTML = '✅ 已发布 · ' + (r.counts.tenants||0) + ' 租户 / ' + (r.counts.magazines||0) + ' 杂志 / ' + (r.counts.pages||0) + ' 页 / ' + (r.counts.covers||0) + ' 封面 · ' + r.bytes + ' bytes<br><a href="' + r.url + '" target="_blank" style="color:var(--primary);text-decoration:none;font-size:11px">查看 OSS 对象</a>';
          toast('发布成功', 'success');
        } else {
          info.textContent = '❌ 发布失败：' + (r && r.error ? r.error : 'unknown');
          toast('发布失败', 'error');
        }
      } catch (e) {
        info.textContent = '❌ 发布失败：' + e.message;
        toast('发布失败', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = oldText;
      }
    }
  </script>
</body>
</html>
