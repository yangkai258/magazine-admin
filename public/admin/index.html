<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>杂志管理平台</title>
  <link rel="stylesheet" href="/admin/css/style.css">
  <script src="/admin/js/auth.js"></script>
</head>
<body>
  <script>MAG_AUTH.requireAuth();</script>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-logo" id="sidebarLogo">
        <div class="sidebar-logo-fallback">📚</div>
        <div style="min-width:0">
          <div class="sidebar-logo-text" id="sidebarLogoText">杂志管理平台</div>
          <div class="sidebar-logo-sub" id="sidebarLogoSub">SaaS · v4</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav"></nav>
    </aside>
    <main class="main-content">
      <header class="top-bar">
        <h1 class="page-title">总览</h1>
        <div id="topbarUserInfo" style="display:flex;align-items:center;gap:8px;margin-left:auto;margin-right:12px;font-size:13px;color:var(--text-secondary)">
          <span>欢迎，<b style="color:var(--text)" id="tbEmail">--</b></span>
          <span id="tbRoleChip" class="chip-role chip-role-viewer" style="display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:#f3f4f6;color:#4b5563;border:1px solid #e5e7eb">--</span>
        </div>
        <div class="tenant-badge" id="tenantBadge" title="">
          <div class="tenant-badge-fallback" id="tenantBadgeFallback">📚</div>
          <div class="tenant-badge-name" id="tenantBadgeName">--<code></code></div>
        </div>
        <button class="btn btn-secondary btn-sm" style="margin-left:0" onclick="MAG_AUTH.logout()">退出登录</button>
      </header>
      <div class="content-area" id="contentArea">
        <div class="dashboard-cards">
          <div class="dash-card">
            <div class="dash-card-icon">📖</div>
            <div class="dash-card-info">
              <div class="dash-card-num" id="totalMagazines">--</div>
              <div class="dash-card-label">杂志总数</div>
            </div>
          </div>
          <div class="dash-card">
            <div class="dash-card-icon">✅</div>
            <div class="dash-card-info">
              <div class="dash-card-num" id="totalEnabled">--</div>
              <div class="dash-card-label">启用数</div>
            </div>
          </div>
          <div class="dash-card">
            <div class="dash-card-icon">🖼</div>
            <div class="dash-card-info">
              <div class="dash-card-num" id="totalCovers">--</div>
              <div class="dash-card-label">封面数量</div>
            </div>
          </div>
          <div class="dash-card">
            <div class="dash-card-icon">📄</div>
            <div class="dash-card-info">
              <div class="dash-card-num" id="totalPages">--</div>
              <div class="dash-card-label">杂志页总数</div>
            </div>
          </div>
        </div>

        <div class="info-panel" style="margin-top:24px;padding:18px 22px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #c7d2fe;border-radius:10px;font-size:13px;color:#4338ca;line-height:1.7">
          <div style="font-weight:600;margin-bottom:4px">💡 SaaS 模式</div>
          数据修改保存后，<strong>阅读端立刻可见</strong>（不需 publish）。
          阅读端拉 <code>/api/public/data</code>（同源 live）→ 本地按 tenant 过滤。
          图片资源走 OSS（admin 上传时直接推 OSS，URL 存在 data 里）。
        </div>
      </div>
    </main>
  </div>
  <script src="/admin/js/nav.js"></script>
  <script src="/admin/js/topbar.js"></script>
  <script src="/admin/js/api.js"></script>
  <script>
    // 渲染侧边栏 nav（统一从 nav.js 拿 10 项，按角色过滤）
    MAG_NAV.render('dashboard').then(function (ctx) {
      var t = ctx && ctx.tenant;
      // 填充租户品牌到顶栏 + 侧边栏（替代硬编码「杂志管理平台」）
      // 注：/api/auth/me 在 attachSession 已透出 logo_url + primary_color；
      //     但 session 是 login 时缓存的，用户改品牌后未重新登录会拿到旧值。
      //     所以这里再调一次 /api/admin/branding 拿最新值（不依赖 session 缓存）。
      initBranding(t);
    });

    // ===== 顶栏 + 侧边栏：填充租户 logo / 名字 =====
    async function initBranding(tenant) {
      if (!tenant) return;
      // 总是从 /api/admin/branding 拿最新值（不依赖 /api/auth/me 的 session 缓存）
      // 原因：用户改品牌后 session 还是旧值，/me 会返回旧 logo/color；
      //       /admin/branding 走 db 直查，每次都是最新。
      try {
        const b = await api.get('/admin/branding');
        if (b) {
          tenant.logo_url = b.logo_url || '';
          tenant.primary_color = b.primary_color || '#4f46e5';
        }
      } catch (e) {
        // 拿不到（401 / 500）就用 /me 透出的字段或默认值
        if (!tenant.logo_url) tenant.logo_url = '';
        if (!tenant.primary_color) tenant.primary_color = '#4f46e5';
      }
      renderTenantBranding(tenant);
    }

    // 顶栏用户信息：欢迎 + 角色徽章；owner 显示「用户管理」菜单
    MAG_AUTH.getUser().then(function(u) {
      if (!u) return;
      var emailEl = document.getElementById('tbEmail');
      var chipEl  = document.getElementById('tbRoleChip');
      if (emailEl) emailEl.textContent = u.email || '';
      if (chipEl) {
        var role = u.role || 'viewer';
        chipEl.textContent = role.toUpperCase();
        chipEl.className = 'chip-role chip-role-' + role;
        // 三色 chip 内联样式（与 tenant-users.html 保持一致）
        chipEl.style.display = 'inline-block';
        chipEl.style.padding = '3px 10px';
        chipEl.style.borderRadius = '12px';
        chipEl.style.fontSize = '11px';
        chipEl.style.fontWeight = '600';
        if (role === 'owner') {
          chipEl.style.background = 'linear-gradient(135deg,#ede9fe,#ddd6fe)';
          chipEl.style.color = '#6d28d9';
          chipEl.style.border = '1px solid #c4b5fd';
        } else if (role === 'editor') {
          chipEl.style.background = '#dbeafe';
          chipEl.style.color = '#1e40af';
          chipEl.style.border = '1px solid #bfdbfe';
        } else {
          chipEl.style.background = '#f3f4f6';
          chipEl.style.color = '#4b5563';
          chipEl.style.border = '1px solid #e5e7eb';
        }
      }
      // 注：nav 的 role-based 显隐已统一由 nav.js 处理
    });

    // ===== 顶栏 + 侧边栏：填充租户 logo / 名字 =====
    function renderTenantBranding(tenant) {
      if (!tenant) return;
      var name = tenant.name || '杂志管理平台';
      var slug = tenant.slug || '';
      var logoUrl = tenant.logo_url || '';
      var color = tenant.primary_color || '#4f46e5';
      // 顶栏徽标
      var badgeName = document.getElementById('tenantBadgeName');
      if (badgeName) {
        badgeName.innerHTML = '';
        var span = document.createElement('span');
        span.textContent = name;
        badgeName.appendChild(span);
        if (slug) {
          var code = document.createElement('code');
          code.textContent = slug;
          badgeName.appendChild(code);
        }
      }
      var badgeFallback = document.getElementById('tenantBadgeFallback');
      if (badgeFallback) {
        badgeFallback.style.background = color;
        badgeFallback.textContent = (name && name.length) ? name.charAt(0) : '📚';
      }
      if (logoUrl) {
        var badge = document.getElementById('tenantBadge');
        if (badge && badgeFallback) {
          var img = document.createElement('img');
          img.className = 'tenant-badge-img';
          img.src = logoUrl;
          img.alt = name;
          img.onerror = function() { this.remove(); badgeFallback.style.display = ''; };
          badgeFallback.style.display = 'none';
          badge.insertBefore(img, badgeFallback);
        }
      }
      // 侧边栏
      var sidebarText = document.getElementById('sidebarLogoText');
      if (sidebarText) sidebarText.textContent = name;
      var sidebarSub = document.getElementById('sidebarLogoSub');
      if (sidebarSub) {
        sidebarSub.textContent = tenant.is_platform_admin ? '👑 平台管理员' : ('租户 · ' + slug);
      }
      var sidebarFallback = document.querySelector('#sidebarLogo .sidebar-logo-fallback');
      if (sidebarFallback && logoUrl) {
        var sImg = document.createElement('img');
        sImg.className = 'sidebar-logo-img';
        sImg.src = logoUrl;
        sImg.alt = name;
        sImg.onerror = function() { this.remove(); sidebarFallback.style.display = ''; };
        sidebarFallback.style.display = 'none';
        sidebarFallback.parentNode.insertBefore(sImg, sidebarFallback);
      }
    }

    (async function() {
      try {
        const [magazines, covers] = await Promise.all([
          api.get('/magazines'),
          api.get('/covers')
        ]);
        document.getElementById('totalMagazines').textContent = magazines.length;
        document.getElementById('totalEnabled').textContent = magazines.filter(m => m.enabled).length;
        document.getElementById('totalCovers').textContent = covers.length;
        let pageCount = 0;
        for (const m of magazines) {
          const detail = await api.get('/magazines/' + m.id);
          pageCount += (detail.pages || []).length;
        }
        document.getElementById('totalPages').textContent = pageCount;
      } catch(e) {
        document.getElementById('contentArea').innerHTML = '<div style="padding:40px;color:#e53935">加载失败：' + e.message + '</div>';
      }
    })();
  </script>
</body>
</html>
