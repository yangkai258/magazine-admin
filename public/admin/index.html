<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>杂志管理平台</title>
  <link rel="stylesheet" href="/admin/css/style.css">
  <script src="/admin/js/auth.js"></script>
</head>
<body>
  <script>MAG_AUTH.requireAuth();</script>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-logo">📚 杂志管理平台</div>
      <nav class="sidebar-nav">
        <a href="/admin/" class="nav-item active" data-page="dashboard">
          <span class="nav-icon">📊</span> 总览
        </a>
        <a href="/admin/magazine/list.html" class="nav-item" data-page="magazine">
          <span class="nav-icon">📖</span> 杂志管理
        </a>
        <a href="/admin/cover/list.html" class="nav-item" data-page="cover">
          <span class="nav-icon">🖼</span> 封面管理
        </a>
        <a href="/admin/platform.html" class="nav-item platform-only" data-page="platform" style="display:none">
          <span class="nav-icon">🏢</span> 平台管理
        </a>
        <a href="/admin/audit.html" class="nav-item platform-only" data-page="audit" style="display:none">
          <span class="nav-icon">📋</span> 审计日志
        </a>
      </nav>
    </aside>
    <main class="main-content">
      <header class="top-bar">
        <h1 class="page-title">总览</h1>
        <button class="btn btn-secondary btn-sm" style="margin-left:auto" onclick="MAG_AUTH.logout()">退出登录</button>
      </header>
      <div class="content-area" id="contentArea">
        <div class="dashboard-cards">
          <div class="dash-card">
            <div class="dash-card-icon">📖</div>
            <div class="dash-card-info">
              <div class="dash-card-num" id="totalMagazines">--</div>
              <div class="dash-card-label">杂志总数</div>
            </div>
          </div>
          <div class="dash-card">
            <div class="dash-card-icon">✅</div>
            <div class="dash-card-info">
              <div class="dash-card-num" id="totalEnabled">--</div>
              <div class="dash-card-label">启用数</div>
            </div>
          </div>
          <div class="dash-card">
            <div class="dash-card-icon">🖼</div>
            <div class="dash-card-info">
              <div class="dash-card-num" id="totalCovers">--</div>
              <div class="dash-card-label">封面数量</div>
            </div>
          </div>
          <div class="dash-card">
            <div class="dash-card-icon">📄</div>
            <div class="dash-card-info">
              <div class="dash-card-num" id="totalPages">--</div>
              <div class="dash-card-label">杂志页总数</div>
            </div>
          </div>
        </div>

        <div class="info-panel" style="margin-top:24px;padding:18px 22px;background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #c7d2fe;border-radius:10px;font-size:13px;color:#4338ca;line-height:1.7">
          <div style="font-weight:600;margin-bottom:4px">💡 SaaS 模式</div>
          数据修改保存后，<strong>阅读端立刻可见</strong>（不需 publish）。
          阅读端拉 <code>/api/public/data</code>（同源 live）→ 本地按 tenant 过滤。
          图片资源走 OSS（admin 上传时直接推 OSS，URL 存在 data 里）。
        </div>
      </div>
    </main>
  </div>
  <script src="/admin/js/api.js"></script>
  <script>
    // 平台管理员才显示「平台管理」「审计日志」菜单
    MAG_AUTH.getTenant().then(function(t) {
      if (t && t.is_platform_admin) {
        document.querySelectorAll('.platform-only').forEach(function(el) { el.style.display = ''; });
      }
    });

    (async function() {
      try {
        const [magazines, covers] = await Promise.all([
          api.get('/magazines'),
          api.get('/covers')
        ]);
        document.getElementById('totalMagazines').textContent = magazines.length;
        document.getElementById('totalEnabled').textContent = magazines.filter(m => m.enabled).length;
        document.getElementById('totalCovers').textContent = covers.length;
        let pageCount = 0;
        for (const m of magazines) {
          const detail = await api.get('/magazines/' + m.id);
          pageCount += (detail.pages || []).length;
        }
        document.getElementById('totalPages').textContent = pageCount;
      } catch(e) {
        document.getElementById('contentArea').innerHTML = '<div style="padding:40px;color:#e53935">加载失败：' + e.message + '</div>';
      }
    })();
  </script>
</body>
</html>
